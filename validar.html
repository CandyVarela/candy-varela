<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validar código — Candy Varela</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:'Segoe UI', system-ui, sans-serif;
    background:#f4f1fb; padding:20px;
  }
  .box{
    max-width:380px; width:100%; background:white; border-radius:16px;
    padding:26px; box-shadow:0 10px 30px rgba(0,0,0,0.1);
  }
  h1{ font-size:20px; margin:0 0 18px; color:#4a2380; text-align:center; }
  input{
    width:100%; padding:12px 14px; border-radius:10px;
    border:1px solid #ddd; font-size:16px; margin-bottom:12px;
  }
  button{
    width:100%; padding:12px 14px; border-radius:10px; border:none;
    background:#7b2ff7; color:white; font-weight:700; font-size:15px; cursor:pointer;
  }
  .result{
    margin-top:16px; padding:14px; border-radius:10px; font-size:14px; text-align:center; display:none;
  }
  .result.ok{ background:#e3f9e5; color:#1e7d32; display:block; }
  .result.bad{ background:#fdeaea; color:#b71c1c; display:block; }
</style>
</head>
<body>
<div class="box">
  <h1>🔎 Validar código de descuento</h1>
  <input id="password" type="password" placeholder="Contraseña del kiosco" />
  <input id="code" type="text" placeholder="Código (ej: CV-A1B2C3)" style="text-transform:uppercase" />
  <button id="btn">Validar y canjear</button>
  <div id="result" class="result"></div>
</div>
<script>
document.getElementById('btn').addEventListener('click', async ()=>{
  const password = document.getElementById('password').value;
  const code = document.getElementById('code').value.trim();
  const resultEl = document.getElementById('result');
  resultEl.className = 'result';
  resultEl.textContent = 'Validando...';
  resultEl.style.display = 'block';

  try{
    const r = await fetch('/api/validar', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password, code })
    });
    const data = await r.json();

    if(!data.ok){
      resultEl.className = 'result bad';
      resultEl.textContent = data.error || 'Error al validar';
      return;
    }
    if(data.valido){
      resultEl.className = 'result ok';
      resultEl.textContent = '✅ Código válido. Aplicá el 10% OFF. (Tel: ' + (data.telefono || '-') + ')';
    } else {
      resultEl.className = 'result bad';
      resultEl.textContent = '❌ ' + data.motivo;
    }
  }catch(e){
    resultEl.className = 'result bad';
    resultEl.textContent = 'Error de conexión.';
  }
});
</script>
</body>
</html>
