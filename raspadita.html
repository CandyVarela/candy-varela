<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raspadita Candy Varela — 10% OFF</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Segoe UI', system-ui, sans-serif;
    background: radial-gradient(circle at 30% 20%, #ff6ec7, #7b2ff7 70%);
    padding:20px;
  }
  .wrap{ max-width:420px; width:100%; text-align:center; color:white; }
  h1{ font-size:26px; margin:0 0 4px; text-shadow:0 3px 0 rgba(0,0,0,0.15); }
  .sub{ opacity:0.9; margin-bottom:20px; font-size:14px; }
  .gate{
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.35);
    border-radius:16px;
    padding:22px;
  }
  .gate input{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:none;
    font-size:16px;
    margin-bottom:12px;
  }
  .gate button, .reset-btn{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:none;
    background:#ffd23f;
    color:#5c2d00;
    font-weight:800;
    font-size:15px;
    cursor:pointer;
  }
  .gate p{ font-size:12px; opacity:0.85; margin-top:10px; }
  .card{
    position:relative; width:100%; aspect-ratio:16/10;
    border-radius:20px; overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,0.35), inset 0 0 0 4px rgba(255,255,255,0.5);
    background:white; touch-action:none;
  }
  .prize-layer{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-weight:800; padding:20px;
  }
  .prize-layer.win{ background:linear-gradient(135deg,#ffd23f,#ff9f1c); color:#5c2d00; }
  .prize-layer.lose{ background:linear-gradient(135deg,#c9c9c9,#9aa0a6); color:#333; }
  .prize-layer .big{ font-size:30px; line-height:1.15; }
  .prize-layer .small{ font-size:13px; font-weight:500; margin-top:8px; opacity:0.85; }
  .code{ margin-top:10px; background:rgba(255,255,255,0.5); padding:6px 14px; border-radius:8px; font-size:16px; letter-spacing:2px; font-weight:700; }
  canvas{ position:absolute; inset:0; width:100%; height:100%; cursor:grab; }
  .hint{ margin-top:16px; font-size:13px; opacity:0.9; }
  .status{ margin-top:18px; font-size:13px; opacity:0.8; min-height:18px; }
  a.backlink{ color:white; opacity:0.75; font-size:12px; display:inline-block; margin-top:18px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🍬 Raspadita Candy Varela</h1>
  <div class="sub">Solo hay <strong>10 premios de 10% OFF</strong> en total. Una raspadita por persona.</div>
  <div id="app"><div>Cargando...</div></div>
  <div class="status" id="status"></div>
  <a class="backlink" href="/">← Volver al catálogo</a>
</div>

<script>
const app = document.getElementById('app');
const statusEl = document.getElementById('status');
const LS_KEY = 'cv_raspadita_result';

function genLocalCache(result){
  localStorage.setItem(LS_KEY, JSON.stringify(result));
}
function getLocalCache(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){ return null; }
}

function renderResult(result){
  const layerClass = result.win ? 'win' : 'lose';
  app.innerHTML = `
    <div class="card">
      <div class="prize-layer ${layerClass}">
        ${ result.win
          ? `<div class="big">🎉 ¡Ganaste 10% OFF!</div><div class="code">${result.code}</div><div class="small">Mostrá esta pantalla en el kiosco para canjearlo</div>`
          : `<div class="big">😿 Sin premio esta vez</div><div class="small">Gracias por jugar, ¡seguí a Candy Varela!</div>` }
      </div>
    </div>
  `;
}

function renderGate(){
  app.innerHTML = `
    <div class="gate">
      <input id="telInput" type="tel" placeholder="Tu WhatsApp (ej: 1122334455)" />
      <button id="playBtn">Jugar mi raspadita 🎟️</button>
      <p>Lo pedimos para que cada persona juegue una sola vez y para poder avisarte si ganás.</p>
    </div>
  `;
  document.getElementById('playBtn').addEventListener('click', startScratch);
}

async function startScratch(){
  const tel = document.getElementById('telInput').value.trim();
  if(tel.length < 6){
    statusEl.textContent = 'Ingresá un teléfono válido.';
    return;
  }
  statusEl.textContent = '';
  app.innerHTML = '<div>Preparando tu raspadita...</div>';

  let data;
  try{
    const r = await fetch('/api/raspar', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ telefono: tel })
    });
    data = await r.json();
  }catch(e){
    app.innerHTML = '<div>Hubo un problema de conexión. Probá de nuevo.</div>';
    return;
  }

  if(!data.ok){
    app.innerHTML = `<div>${data.error || 'Error inesperado'}</div>`;
    return;
  }
  if(data.yaJugo){
    app.innerHTML = '<div>Ese número ya jugó su raspadita antes. ¡Gracias por participar!</div>';
    return;
  }

  const result = { win: data.win, code: data.code };
  genLocalCache(result);
  renderScratchCard(result);
}

function renderScratchCard(result){
  app.innerHTML = `
    <div class="card" id="cardBox">
      <div class="prize-layer" id="prizeLayer"></div>
      <canvas id="scratchCanvas"></canvas>
    </div>
    <div class="hint">👆 Raspá con el dedo o el mouse</div>
  `;

  const cardBox = document.getElementById('cardBox');
  const canvas = document.getElementById('scratchCanvas');
  const ctx = canvas.getContext('2d');
  let scratching = false;
  let revealed = false;

  function resize(){
    const rect = cardBox.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    drawCover();
  }
  function drawCover(){
    const g = ctx.createLinearGradient(0,0,canvas.width,canvas.height);
    g.addColorStop(0,'#c0c0c0'); g.addColorStop(1,'#8f8f8f');
    ctx.fillStyle = g; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.font = 'bold ' + Math.floor(canvas.width*0.09) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🎟️ RASPÁ', canvas.width/2, canvas.height/2 + 15);
  }
  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }
  function scratchAt(x,y){
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath(); ctx.arc(x,y, canvas.width*0.06, 0, Math.PI*2); ctx.fill();
  }
  function checkProgress(){
    if(revealed) return;
    const imgData = ctx.getImageData(0,0,canvas.width,canvas.height).data;
    let cleared = 0;
    const total = imgData.length/4;
    for(let i=3;i<imgData.length;i+=4*20){ if(imgData[i] < 50) cleared++; }
    const sampledTotal = Math.ceil(total/20);
    if(cleared / sampledTotal > 0.45){
      revealed = true;
      canvas.style.transition = 'opacity 0.4s';
      canvas.style.opacity = '0';
      setTimeout(()=>canvas.remove(), 400);
      const prizeLayer = document.getElementById('prizeLayer');
      prizeLayer.className = 'prize-layer ' + (result.win ? 'win' : 'lose');
      prizeLayer.innerHTML = result.win
        ? `<div class="big">🎉 ¡Ganaste 10% OFF!</div><div class="code">${result.code}</div><div class="small">Mostrá esta pantalla en el kiosco para canjearlo</div>`
        : `<div class="big">😿 Sin premio esta vez</div><div class="small">Gracias por jugar, ¡seguí a Candy Varela!</div>`;
      statusEl.textContent = 'Resultado guardado. Ya jugaste tu única raspadita.';
    }
  }

  canvas.addEventListener('mousedown', e=>{ scratching=true; const p=getPos(e); scratchAt(p.x,p.y); });
  canvas.addEventListener('mousemove', e=>{ if(scratching){ const p=getPos(e); scratchAt(p.x,p.y); checkProgress(); }});
  window.addEventListener('mouseup', ()=> scratching=false);
  canvas.addEventListener('touchstart', e=>{ scratching=true; const p=getPos(e); scratchAt(p.x,p.y); }, {passive:true});
  canvas.addEventListener('touchmove', e=>{ if(scratching){ const p=getPos(e); scratchAt(p.x,p.y); checkProgress(); }}, {passive:true});
  window.addEventListener('touchend', ()=> scratching=false);
  window.addEventListener('resize', resize);
  resize();
}

// init
const cached = getLocalCache();
if(cached){
  renderResult(cached);
  statusEl.textContent = 'Ya jugaste antes en este dispositivo — este es tu resultado.';
} else {
  renderGate();
}
</script>
</body>
</html>
